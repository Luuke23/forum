<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>掲示板</title>
		<link rel="stylesheet" th:href="@{/css/style.css}">	</head>
	<body> 
		<header>
			<div class="header-container">
				<div class="header-contents">
					<h1>掲示板</h1>
					<form class="logout" th:action="@{/logout}" th:method="post">
						<input type="submit" value="ログアウト">
					</form>
				</div>
				<div class="menu">
					<nav>
						<ul>
							<li><a th:href="@{/message/new}">新規投稿</a></li>
						</ul>
					</nav>
					<nav>
						<ul>
							<li><a th:href="@{/user/edit}">ユーザー編集</a></li>
						</ul>
					</nav>
				</div>
			</div>
		</header>
		<main>
			<div class="main-contents">
				<div class="message-card" th:each="message : ${messages}">
					<strong class="message-title" th:text="${message.title}"></strong>
					<div class="message-text" th:text="${message.text}"></div>
					<div class="message-info">
						<span>投稿者：<span th:text="${message.user.account}"></span></span>
						<span>カテゴリ：<span th:text="${message.category}"></span></span>
						<span>投稿日時：<span th:text="${#dates.format(message.createdDate, 'yyyy-MM-dd HH:mm:ss')}"></span></span>
					</div>
					
					<div class="action-area" th:if="${loginUser.user.id == message.user.id}">
						<form class="action-button btn-edit" th:action="@{/message/edit/{id}(id=${message.id})}" th:method="get">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<input type="hidden" name="userId" th:value="${message.user.id}">
							<input type="submit" value="編集">
						</form>

						<form class="action-button btn-delete" th:action="@{/message/delete/{id}(id=${message.id})}" th:method="post">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<input type="hidden" name="userId" th:value="${message.user.id}">
							<input type="submit" value="削除">
						</form>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
