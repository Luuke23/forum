<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" th:href="@{/css/style.css}">
    <title>掲示板 ログインページ</title>
</head>
<body>
<div class="login-header">
    <h2 class="login-h2">掲示板 ログインページ</h2>
</div>
<div class="main-contents">
    <div th:if="${errorMessages}">
        <div class="login-errorMessages">
            <div th:each="errorMessage : ${errorMessages}">
                <span th:text="${errorMessage}"></span>
            </div>
        </div>
    </div>
    <div class="login-form">
        <form th:action="@{/login}" method="post">
            <label>アカウント名</label>
            <input type="text" name="account" th:value="${account}"/>
            
            <label>パスワード</label>
            <input type="password" name="password"/>
            
            <input type="submit" value="ログイン"/>
        </form>
    </div>
    
    <div class="new-user">
		<a th:href="@{/user/new}">会員登録</a>
	</div>
</div>
<div class="footer-contents">
</div>
</body>
</html>
